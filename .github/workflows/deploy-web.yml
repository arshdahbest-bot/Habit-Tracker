# Builds the web version of IBee and publishes it for free on GitHub Pages.
# Runs on every push to main. One-time setup: repo Settings > Pages > Source: GitHub Actions.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Serve the app from /<repo name>/
        run: |
          jq --arg base "/${GITHUB_REPOSITORY#*/}" '.expo.experiments.baseUrl = $base' app.json > app.tmp.json
          mv app.tmp.json app.json
      - name: Build website
        run: npx expo export --platform web --output-dir dist
        env:
          # Optional: add these as repository secrets to turn on the online leaderboard.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Let page links work after a refresh
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
